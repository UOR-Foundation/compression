[package]
name = "uorc"
description = "UORC client: lossless compression to exact executable Universal Object Reference archives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "uorc"
path = "src/bin/uorc.rs"

[dependencies]
libc = "0.2"
sha2 = "0.11.1"
uorc_compress = { version = "0.1.0", path = "../../generated/rust/uorc_compress" }
uorc_decompress = { version = "0.1.0", path = "../../generated/rust/uorc_decompress" }

[lints]
workspace = true
