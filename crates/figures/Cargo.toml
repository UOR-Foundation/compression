[package]
name = "figures"
description = "Rejects numbers written into uorc's implementation that the Prism model does not account for, and keeps the register of those already there (model/figures.toml), which can only shrink."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "figures"
path = "src/main.rs"

[dependencies]
proc-macro2 = "1.0.107"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "3.0.4", default-features = false, features = ["full", "parsing", "visit"] }
toml = "1.2.0"

[lints]
workspace = true
