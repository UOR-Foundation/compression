[package]
name = "uorc-engine"
description = "The uorc engine (Uorc.Engine): mints dominance hypotheses over the codec space, decides them by kappa, consolidates the winners into the shipped portfolio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "uorc-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.1"
toml = "1.2"
uorc = { version = "0.4.0", path = "../uorc" }

[lints]
workspace = true
