[package]
name = "frontier"
description = "uorc's claim register (frontier.toml) and decider: closed performance claims over κ-named corpora, decided by running the shipped codec."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "frontier"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
toml = "0.8.23"
uorc = { workspace = true }

[lints]
workspace = true
