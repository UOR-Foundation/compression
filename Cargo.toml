[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
# The client crates LexLean exports are dependencies, not members: they carry
# LexLean's lint table and formatting, which the workspace gates do not own.
exclude = ["generated/rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Raise this when something here needs a newer compiler; nothing does yet.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
# UORC repository canonical URLs.
repository = "https://github.com/UOR-Foundation/compression"
homepage = "https://github.com/UOR-Foundation/compression"
authors = ["UOR Foundation"]
keywords = []
categories = []

[workspace.dependencies]
repo-model = { version = "0.1.0", path = "crates/model" }
# A `path` dependency with no `version` is a wildcard requirement, and
# `cargo deny` refuses those (`wildcards = "deny"`). Every internal dependency
# carries both.
repo-conformance = { version = "0.1.0", path = "crates/conformance" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Dependencies (LexLean above all) carry no debug info in dev/test builds:
# the SDK gate builds in a bounded temporary filesystem, and debug symbols of
# the compiler crate alone exceed it.
[profile.dev.package."*"]
debug = false
