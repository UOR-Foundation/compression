# Deploys the Pages site that a release run built. The github-pages environment
# accepts deployments from the default branch only, so a run started by a tag
# push cannot deploy it; release.yml dispatches this workflow on the default
# branch with its own run id, and this copies that run's site and deploys it.
name: pages

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Release run whose github-pages artifact to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: github-pages
          path: site
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: github-pages
          path: site/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
