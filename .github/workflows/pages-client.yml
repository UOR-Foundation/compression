# UC-WEB-01: the Pages client, built as the release builds it, driven through
# every journey of its Prism product model (src/Uorc/Page.lex.tex) in headless
# Chrome by scripts/page-acceptance.mjs.
name: pages client

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-client-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance:
    name: pages client / product model acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the wasm client and the site
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p uorc-wasm --target wasm32-unknown-unknown
          mkdir -p .tmp/bench
          for f in bench.html bench.json bench.md; do printf 'benchmarks are published with each release\n' > ".tmp/bench/$f"; done
          node scripts/site.mjs .tmp/site --wasm target/wasm32-unknown-unknown/release/uorc_wasm.wasm --version "$(git describe --tags --always)-dev" --bench .tmp/bench
      - name: Walk every journey of the product model in Chrome
        shell: bash
        run: node scripts/page-acceptance.mjs .tmp/site --chrome "$(command -v google-chrome)" --report .tmp/page-acceptance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: page-acceptance
          path: .tmp/page-acceptance.json
          if-no-files-found: warn
          retention-days: 30
