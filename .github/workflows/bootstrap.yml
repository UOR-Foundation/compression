# This is the minimal human-reviewed trust root. PrismPM does not generate it.
name: bootstrap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # `just vv` runs here as independent legs, each from its own clean checkout,
  # at once. Together the legs run every recipe of `vv` exactly once on the
  # normative x86-64 host; the arm host runs the host-dependent `rest` leg.
  # Wall time is the slowest leg, not the sum.
  template-gate:
    name: acceptance / ${{ matrix.leg }} / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: rest, runner: ubuntu-24.04, recipes: "lexlean-authority template-check fmt-check model lint test features bdd deny" }
          - { leg: rest, runner: ubuntu-24.04-arm, recipes: "lexlean-authority template-check fmt-check model lint test features bdd deny" }
          - { leg: artifacts, runner: ubuntu-24.04, recipes: "lexlean-artifacts" }
          - { leg: claims, runner: ubuntu-24.04, recipes: "claim-dispositions" }
          - { leg: varint, runner: ubuntu-24.04, recipes: "varint-proofs" }
          - { leg: reproducibility, runner: ubuntu-24.04, recipes: "reproducibility" }
          - { leg: integrity, runner: ubuntu-24.04, recipes: "integrity" }
    runs-on: ${{ matrix.runner }}
    # The full verify's certificate stage runs one Lean process per production
    # root, serially (LexLean 0.4), which alone takes about half an hour.
    timeout-minutes: ${{ matrix.leg == 'artifacts' && 120 || 60 }}
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run this leg of the template gate through the locked SDK
        shell: bash
        env:
          LEG_RECIPES: ${{ matrix.recipes }}
        run: |
          set -euo pipefail
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          if [[ ! $image =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'prismpm.lock does not select an immutable SDK image' >&2
            exit 64
          fi
          docker_config=$(mktemp -d)
          trap 'rm -rf "$docker_config"' EXIT
          if test -f "$HOME/.docker/config.json"; then
            cp "$HOME/.docker/config.json" "$docker_config/config.json"
          else
            printf '{}\n' >"$docker_config/config.json"
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --tmpfs /tmp:rw,exec,nosuid,size=2g \
            --volume "$PWD:$PWD" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$docker_config:/tmp/prismpm-home/.docker:ro" \
            --workdir "$PWD" \
            --env DOCKER_CONFIG=/tmp/prismpm-home/.docker \
            --env BUILDX_CONFIG=/tmp/prismpm-buildx \
            --env HOME=/tmp/prismpm-home \
            --env PRISMPM_EPHEMERAL_HOME=1 \
            --env SDK_IMAGE="$image" \
            --env LEG_RECIPES="$LEG_RECIPES" \
            "$image" bash -c '
              set -euo pipefail
              umask 077
              docker buildx version
              docker buildx inspect --bootstrap
              manifest=$(docker buildx imagetools inspect "$SDK_IMAGE")
              grep -q "linux/amd64" <<< "$manifest"
              grep -q "linux/arm64" <<< "$manifest"
              devcontainer --version
              exec just $LEG_RECIPES
            '

  # The single required signal per host: it passes only when every leg passed.
  acceptance:
    name: acceptance / ${{ matrix.runner }}
    needs: template-gate
    if: always()
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every leg of the gate
        shell: bash
        env:
          LEGS: ${{ needs.template-gate.result }}
        run: test "$LEGS" = success
