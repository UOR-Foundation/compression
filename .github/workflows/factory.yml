# Records receipts. After a bootstrap, offline or release run from this
# repository completes, this turns the outcomes its jobs uploaded into receipts
# on the factory-receipts branch (scripts/factory.mjs publish). It runs from the
# default branch with its own token, so no pull-request code ever gets write
# access, and an outcome from a fork is never recorded. Runs that finish
# together each rebuild on the branch's newest head and retry the push.
#
# Then it ships the default branch's workspace version when nothing has yet:
# merging a version bump is the release. Once the bootstrap gate is proved on
# the head, a release rehearsal builds, benchmarks and decides that tree; once
# every release stage is proved too, the head is tagged v<version> and
# release.yml is dispatched from the default branch to publish it (a tag made
# with this token starts no workflow, and the github-pages environment
# refuses tag refs, so the run comes from the branch and checks out the tag).
name: factory

on:
  workflow_run:
    workflows: [bootstrap, SDK offline reproducibility, release, pages client]
    types: [completed]
  # Re-decides the release step by hand (e.g. after fixing a failed rehearsal).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipts:
    name: record receipts
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: factory-outcome-*
          path: .tmp/outcomes
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish the run's receipts and reweigh the schedule
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_RUN_ID: ${{ github.event.workflow_run.id }}
          FACTORY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node scripts/factory.mjs publish .tmp/outcomes

  release:
    name: tag the workspace version
    needs: receipts
    if: always() && (needs.receipts.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: factory-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Decide the next release step for the head
        id: step
        env:
          TRIGGER: ${{ github.event.workflow_run.name || github.event_name }}
        run: node scripts/factory.mjs release-step --context "trigger=$TRIGGER" | tee -a "$GITHUB_OUTPUT"
      - name: Rehearse the release on the head
        if: steps.step.outputs.step == 'rehearse'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ steps.step.outputs.sha }}
        run: |
          set -euo pipefail
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$busy" != 0 ]; then echo "a release run is already in progress; its receipts decide the next step"; exit 0; fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f ref="$SHA" -f mode=rehearsal
      - name: Tag the head and publish it
        if: steps.step.outputs.step == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.step.outputs.tag }}
          SHA: ${{ steps.step.outputs.sha }}
        run: |
          set -euo pipefail
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="uorc $TAG" -f object="$SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" >/dev/null
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f ref="$TAG" -f mode=publish
          echo "::notice title=released $TAG::tagged $SHA and dispatched the publish run"
