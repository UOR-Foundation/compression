[[claim]]
id = "UC-NEU-01"
level = "build"
statement = "The ncm coder's plasticity is stated as the Prism neuromorphic standard in Uorc.Neuromorphic, with kernel-checked bounds: every mixer weight stays within plus or minus 2^22 under the bounded Hebbian rule, potentiation never lowers and depression never raises a weight, the plasticity lies between 24 and 128 per 65536 (128 at the first byte, 24 in the limit), one bit's weight change is at most 16376 and every product fits a 32-bit lane, a context slot never steps past its gap to the coded bit and consolidates at count 127, and every probability-map point stays within 16 bits; the native coder reads the model's constants."
evidence_kind = "kernel_theorem"
research_disposition = "not_measured"
feature = "features/suites/neuromorphic-standard.feature"

[[claim]]
id = "UC-ENG-01"
level = "build"
statement = "The uorc engine moves the codec through its space without an LLM in the loop, under the laws of Uorc.Engine, which are kernel-checked: rule 30 on a 64-cell ring stays in the ring, search and portfolio weights stay within 1..16 under the bounded Hebbian rule (+2, -1), the winner of a proved dominance is scheduled before the incumbent it beat, dominance in bytes and steps is irreflexive, asymmetric and transitive and never costs bytes, a claim whose kappa is decided is never minted again, and the generated workflow's schedule and budgets are valid. Each tick mints candidates next to each family's incumbent by the rule 30 register and the search weights, decides them over the kappa-named corpus, and ships a moved portfolio only when it dominates the shipped one; the shipped table and the workflow are generated from the engine state and the model."
evidence_kind = "kernel_theorem"
research_disposition = "not_measured"
feature = "features/suites/codec-engine.feature"

[[claim]]
id = "UC-WEB-01"
level = "build"
statement = "The Pages client is generated from and conforms to its Prism product model in Uorc.Page: stakeholders, features with their calls and acceptance cases, journeys, the page's UML state machine, operations, fields, controls, examples, error hints, sections, usage, links and quality measures. The generated page holds exactly the modeled elements, and a real browser walks every journey, takes every modeled transition, checks every control's enabled state in every state it reaches and holds every gated quality measure."
evidence_kind = "build_evidence"
research_disposition = "not_measured"
feature = "features/suites/pages-client.feature"

[[claim]]
id = "UC-PERF-02"
level = "build"
statement = "For every input length n, the settled frame of Uorc.Performance is no larger than the raw frame and no larger than a coded kernel candidate, and the raw frame is two length varints of at most 10 bytes each, the n input bytes and 41 fixed bytes, so no frame of one object exceeds n + 61 bytes (archiveBound), and a stream of k such frames is within n + 61 * k bytes; the native client keeps the same rule and the same constants."
evidence_kind = "kernel_theorem"
research_disposition = "not_measured"
feature = "features/suites/performance-theorems.feature"

[[claim]]
id = "UC-PERF-03"
level = "build"
statement = "For every list of trials, the trial the portfolio keeps (Uorc.Performance best) is no larger in bytes than any coded trial in the list (bestNoLargerThanEvery), so a portfolio archive is no larger than the archive of any strategy it scheduled."
evidence_kind = "kernel_theorem"
research_disposition = "not_measured"
feature = "features/suites/performance-theorems.feature"

[[claim]]
id = "UC-PERF-04"
level = "build"
statement = "A step is one model input evaluated for one coded bit. For every profile word the input count lies between 3 and 24 (17 context bits, 3 fixed inputs, 2 for each of the short-match and repeat features), a frame of n bytes costs 8 * n * inputs steps, and for every frame kind (raw, reference, ncm, ncm from a named state) decode takes at most 192 steps per modelled byte (decodeStepsBound); the full profile costs 192 steps per byte and the v0.3 profile 160. The measure counts model inputs, not machine time."
evidence_kind = "kernel_theorem"
research_disposition = "not_measured"
feature = "features/suites/performance-theorems.feature"

[[claim]]
id = "UC-PERF-05"
level = "build"
statement = "A trial carries its defect, the count of bytes at which its decode differs from the input. Admission fails every trial with a nonzero defect, keeping never raises a defect above its operands', and the trial kept from any admitted list has defect 0 (bestOfAdmittedIsExact): whatever codec point or named model state produced a trial, it can change the archive's size and never its meaning."
evidence_kind = "kernel_theorem"
research_disposition = "not_measured"
feature = "features/suites/performance-theorems.feature"

[[claim]]
id = "UC-PERF-06"
level = "build"
statement = "A candidate dominates an incumbent when it is no larger in bytes and no larger in steps, and its gain is the drop in bytes plus steps. The gain never exceeds the drop in cost (dominanceLowersCost), no trial gains over itself, gains compose (a positive gain of a over b and of b over c gives at least their sum of a over c), and a positive gain implies no growth in bytes or in steps: dominance is a strict partial order, so consolidating winners cannot cycle."
evidence_kind = "kernel_theorem"
research_disposition = "not_measured"
feature = "features/suites/performance-theorems.feature"

[[claim]]
id = "UC-PERF-07"
level = "build"
statement = "A trial abandoned at a bound is modelled as a trial of at most the bound's bytes. For every list of trials and every raw length, the portfolio of trials abandoned at the raw length settles to the same size as the portfolio of complete trials (boundedPortfolioSettlesTheSame), and a trial no smaller than one already kept changes neither the kept bytes nor the kept steps (skippedTrial theorems): a search that stops a candidate once it cannot win, or skips one known to be no smaller, writes an archive of the same size for fewer compress steps."
evidence_kind = "kernel_theorem"
research_disposition = "not_measured"
feature = "features/suites/performance-theorems.feature"

[[claim]]
id = "UC-PERF-08"
level = "build"
statement = "Choosing by fewer bytes and then fewer steps, from the raw frame and any list of trials, keeps a trial that is no later in that order than every trial in the list and than the raw frame (chosenIsLeast, chosenIsNoWorseThanRaw), has exactly the size the bytes-only rule settles to (chosenKeepsTheSize), and is dominated by no trial it is no later than (leastIsUndominated); a trial no earlier than the kept one changes nothing (excludedTrial theorems). The rule lowers decode steps on byte ties at no cost in size. The client's choice is this rule, in the model (Client.pick) and natively (compress_is_the_chosen_trial_uc_perf_08)."
evidence_kind = "kernel_theorem"
research_disposition = "not_measured"
feature = "features/suites/performance-theorems.feature"

[[claim]]
id = "UC-PERF-09"
level = "build"
statement = "The potential of a codec point is its bytes plus its steps. Consolidating a candidate into an incumbent lowers the potential by exactly the candidate's gain (consolidationSpendsItsGain), which is positive exactly when the candidate dominates, and over any sequence of candidates the potential never rises (potentialNeverRises). The potential is a natural number, so an engine that consolidates only dominating candidates never regresses and consolidates at most as many times as its first potential."
evidence_kind = "kernel_theorem"
research_disposition = "not_measured"
feature = "features/suites/performance-theorems.feature"

[[claim]]
id = "UC-PERF-10"
level = "build"
statement = "The encoder's stop is a ledger over its coder events: its count of emitted bytes saturates at the cap (ledgerSaturatesAtTheCap), so a payload below the cap is exactly the unbounded payload, four header bytes, the emitted bytes and one final byte (stopKeepsEveryPayloadBelowTheCap), and a candidate is abandoned exactly when its emitted bytes reach the cap and at no other point (stopAbandonsExactlyAtTheCap). A coded bit at a 12-bit probability narrows the coder's width by at least one and by at least one part in 4096 (aOneNarrowsTheWidth, aOneSpendsAFraction, aZeroNarrowsTheWidth, aZeroSpendsAFraction). No exact rule decides a raw frame earlier than its ledger does (exactRawDecision): until a candidate's ledger reaches the cap, a continuation the model codes in few bytes can still make the coded frame the smaller one. Measured: random bytes code to 0.28 to 0.30 percent over raw under every shipped profile, so on random input the earliest exact stop comes at about 99.7 percent of the frame."
evidence_kind = "kernel_theorem"
research_disposition = "not_measured"
feature = "features/suites/performance-theorems.feature"

[[claim]]
id = "UC-PERF-11"
level = "build"
statement = "Input the model cannot shrink costs one coder pass per scheduled candidate, so that cost falls only through passes that write the same bytes in less time. Strategies whose profiles differ only in mixer selection read the same contexts, slots, match and repeat state and mixers 2 and 3, so when no core is spare they are coded in one shared pass that writes each strategy's own payload (ncm::encode_pair_below). It changes no byte: the shared pass equals the two separate passes in both directions of the pair and when either side is abandoned, and the client's archives do not depend on the thread count."
evidence_kind = "build_evidence"
research_disposition = "not_measured"
feature = "features/suites/performance-theorems.feature"

[[claim]]
id = "UC-PERF-16"
level = "build"
statement = "A frame's window facets step on its chosen archive (Client.stepWindow): its coding is recoded over one more earlier frame of its block at a time, then with one more match table bit at a time, and each step is kept only while the archive gets strictly shorter and the decoder fits the declared decode host; each facet stops at the first step that does not pay or does not fit, so no depth or table size is fixed. A frame is therefore the portfolio's archive byte for byte or a strictly shorter one, and it decodes to the frame."
evidence_kind = "build_evidence"
research_disposition = "not_measured"
feature = "features/suites/performance-theorems.feature"

[[claim]]
id = "UC-PERF-17"
level = "build"
statement = "The profiled window entry over k earlier frames is one form for every k of at least 1 (Archive.profilePrefix, Archive.profileTail): three graph nodes per frame concatenate basis roots 1 to k in order, and the call to the coder reaches its payload and profile word three nodes further back per frame. For one and two frames it is the fixed entry byte for byte, and the decoder reads k from the entry, so window depth is a facet of the archive rather than a constant of the format."
evidence_kind = "build_evidence"
research_disposition = "not_measured"
feature = "features/suites/performance-theorems.feature"

[[claim]]
id = "UC-WEB-02"
level = "build"
statement = "The product shows the codec as a point of its modelled space: uorc inspect, the library's Info JSON and the Pages client name each frame's codec point (basis, ncm profile word, consolidated model state, lanes and its κ) and the exact steps its decode takes, as Uorc.Performance defines them, from the header alone; the page's model view shows the release's performance theorems, its closed claims with codec point, corpus κ, bytes, steps and the factory's decision, and the engine's tick, rule30 register and weights, exactly as the release publishes them in model.json."
evidence_kind = "build_evidence"
research_disposition = "not_measured"
feature = "features/suites/pages-client.feature"
