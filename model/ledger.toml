[[claim]]
id = "UC-ENG-01"
level = "build"
statement = "The uorc engine moves the codec through its space without an LLM in the loop, under the laws of Uorc.Engine, which are kernel-checked: rule 30 on a 64-cell ring stays in the ring, search and portfolio weights stay within 1..16 under the bounded Hebbian rule (+2, -1), the winner of a proved dominance is scheduled before the incumbent it beat, dominance in bytes and steps is irreflexive, asymmetric and transitive and never costs bytes, a claim whose kappa is decided is never minted again, and the generated workflow's schedule and budgets are valid. Each tick mints candidates next to each family's incumbent by the rule 30 register and the search weights, decides them over the kappa-named corpus, and ships a moved portfolio only when it dominates the shipped one; the shipped table and the workflow are generated from the engine state and the model."
evidence_kind = "kernel_theorem"
research_disposition = "not_measured"
feature = "features/suites/codec-engine.feature"

[[claim]]
